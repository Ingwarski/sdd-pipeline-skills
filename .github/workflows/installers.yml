name: SDD and installer validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only content tools
        run: python -m pip install -r tests/requirements.txt
      - name: Validate ownership, resources and skill YAML
        run: python -m unittest discover -s tests -p 'test_skill_contracts.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Compare full instruction loads, including references and retries
        run: python scripts/measure_tokens.py --summary --check

  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Test stage checker and installer input contract
        run: python -m unittest discover -s tests -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Test symlink installer
        run: bash tests/test-install.sh
      - name: Test retirement cleanup
        run: bash tests/test-retirement.sh
      - name: Test safe updater
        run: bash tests/test-update.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Test stage checker and installer input contract
        shell: powershell
        run: python -m unittest discover -s tests -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Test symbolic-link and junction installer
        shell: powershell
        run: .\tests\test-install.ps1
      - name: Test retirement cleanup
        shell: powershell
        run: .\tests\test-retirement.ps1
      - name: Test safe updater
        shell: powershell
        run: .\tests\test-update.ps1
