name: Installer validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test symlink installer
        run: bash tests/test-install.sh
      - name: Test retirement cleanup
        run: bash tests/test-retirement.sh
      - name: Test safe updater
        run: bash tests/test-update.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test symbolic-link and junction installer
        shell: powershell
        run: .\tests\test-install.ps1
      - name: Test retirement cleanup
        shell: powershell
        run: .\tests\test-retirement.ps1
      - name: Test safe updater
        shell: powershell
        run: .\tests\test-update.ps1
